version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: tableserve-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tableserve
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    networks:
      - tableserve-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tableserve"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Restaurant Service
  restaurant-service:
    build:
      context: .
      dockerfile: services/restaurant-service/Dockerfile
    container_name: tableserve-restaurant-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tableserve
      JWT_SECRET: tableserve-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tableserve-network

  # 3. Reservation & Payment Service
  reservation-service:
    build:
      context: .
      dockerfile: services/reservation-service/Dockerfile
    container_name: tableserve-reservation-service
    restart: unless-stopped
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tableserve
      JWT_SECRET: tableserve-super-secret-jwt-key-2026
      AWS_REGION: us-east-1
      AWS_SNS_TOPIC_ARN: arn:aws:sns:us-east-1:123456789012:tableserve-reservations-topic
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tableserve-network

  # 4. Ordering Service
  ordering-service:
    build:
      context: .
      dockerfile: services/ordering-service/Dockerfile
    container_name: tableserve-ordering-service
    restart: unless-stopped
    ports:
      - "5003:5003"
    environment:
      PORT: 5003
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tableserve
      JWT_SECRET: tableserve-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tableserve-network

  # 5. Search Service
  search-service:
    build:
      context: .
      dockerfile: services/search-service/Dockerfile
    container_name: tableserve-search-service
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tableserve
      JWT_SECRET: tableserve-super-secret-jwt-key-2026
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tableserve-network

  # 6. API Gateway Hub
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: tableserve-api-gateway
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/tableserve
      JWT_SECRET: tableserve-super-secret-jwt-key-2026
      RESTAURANT_SERVICE_URL: http://restaurant-service:5001
      RESERVATION_SERVICE_URL: http://reservation-service:5002
      ORDERING_SERVICE_URL: http://ordering-service:5003
      SEARCH_SERVICE_URL: http://search-service:5004
    depends_on:
      - restaurant-service
      - reservation-service
      - ordering-service
      - search-service
    networks:
      - tableserve-network

  # 7. React Frontend UI
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tableserve-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      GATEWAY_URL: http://api-gateway:5000
    depends_on:
      - api-gateway
    networks:
      - tableserve-network

networks:
  tableserve-network:
    driver: bridge

volumes:
  postgres_data:
