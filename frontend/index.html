<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TABLESERVE | Restaurant Reservation & Ordering Platform</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fff7ed',
                100: '#ffedd5',
                500: '#f97316',
                600: '#ea580c',
                700: '#c2410c',
              }
            }
          }
        }
      }
    </script>

    <!-- Global CSS -->
    <link rel="stylesheet" href="/src/index.css" />

    <!-- Error Catch Overlay -->
    <script>
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('debug-error-box');
        if (errBox) {
          errBox.style.display = 'block';
          errBox.innerHTML = '<strong>Frontend Error:</strong> ' + e.message + ' at ' + e.filename + ':' + e.lineno;
        }
      });
    </script>

    <!-- Local Offline-Ready React 18 Core -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>

    <!-- CDN Fallback in case local fails -->
    <script>
      if (typeof React === 'undefined') {
        document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"><\/script>');
        document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"><\/script>');
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-500 selection:text-white min-h-screen flex flex-col">
    <!-- Visible Error Container for Debugging -->
    <div id="debug-error-box" style="display:none; padding:16px; background:#fee2e2; color:#b91c1c; border-bottom:2px solid #ef4444; font-family:monospace; font-size:12px; z-index:99999;"></div>

    <!-- React Root Mount -->
    <div id="root">
      <!-- Loading Placeholder while JS hydrates -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, sans-serif;">
        <div style="width: 48px; height: 48px; border: 4px solid #f97316; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin-top: 16px; color: #64748b; font-weight: 600; font-size: 14px;">Loading TABLESERVE Platform...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>

    <!-- Pre-Compiled Vanilla JavaScript Application (Zero Babel Compilation Required in Browser) -->
    <script src="/App.js"></script>
  </body>
</html>
